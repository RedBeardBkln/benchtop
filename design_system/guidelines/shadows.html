<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper-100)}*{box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}</style></head><body><div class="row" style="gap:24px"><div style="width:96px;height:76px;border-radius:12px;box-shadow:var(--shadow-1);background:#fff;display:grid;place-items:end start;padding:8px;font:11px var(--font-mono)">1</div><div style="width:96px;height:76px;border-radius:12px;box-shadow:var(--shadow-2);background:#fff;display:grid;place-items:end start;padding:8px;font:11px var(--font-mono)">2</div><div style="width:96px;height:76px;border-radius:12px;box-shadow:var(--shadow-3);background:#fff;display:grid;place-items:end start;padding:8px;font:11px var(--font-mono)">3</div><div style="width:96px;height:76px;border-radius:12px;box-shadow:var(--shadow-pop);background:var(--lcd-300);border:1.5px solid var(--ink-900);display:grid;place-items:end start;padding:8px;font:11px var(--font-mono)">pop</div><div style="width:96px;height:76px;border-radius:12px;box-shadow:var(--shadow-inset-screen);background:var(--lcd-300);display:grid;place-items:end start;padding:8px;font:11px var(--font-mono)">inset-screen</div><div style="width:96px;height:76px;border-radius:12px;box-shadow:var(--glow-lcd);background:var(--lcd-300);display:grid;place-items:end start;padding:8px;font:11px var(--font-mono)">glow-lcd</div></div></body></html>
